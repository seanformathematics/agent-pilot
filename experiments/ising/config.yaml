# Prototype of First Science Run: Single Agent Ising Modeler.
experiment: ising_sonnet_at_medium_pinned
design: experiments/ising/design.md
topology: independent
model: claude-sonnet-5-5
effort: medium                  # optional; omit to use the model's own default

# Experiment code, referenced as "module.path:attribute".
submission_model: experiments.ising.schemas:IsingSubmission
sanity_checks: experiments.ising.checks:check_submission
analysis: experiments.ising.analysis:analyze

roles:
  solver:
    system_prompt: experiments/ising/prompts/solver.txt
    tools: [run_python, submit_result]

agents:
  - id: ising-01
    role: solver
    task: "For a lattice of size N=16 and each temperature T in [1.5, 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7, 2.8], estimate the Binder cumulant U and its one-sigma statistical error U_err. The target is U_err <= 0.005 for each value of T."
    # task is read by checks.py parser looking for N and T values.
