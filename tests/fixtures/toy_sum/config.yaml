# Toy experiment used to build and test the harness. Not science.
# Paths are relative to the repository root.
experiment: toy_sum
design: tests/fixtures/toy_sum/design.md
topology: single
model: claude-opus-5-5
effort: low                    # optional; omit to use the model's own default

# Experiment code, referenced as "module.path:attribute".
submission_model: tests.fixtures.toy_sum.schemas:SumSubmission
sanity_checks: tests.fixtures.toy_sum.checks:check_submission
analysis: tests.fixtures.toy_sum.analysis:analyze

roles:
  solver:
    system_prompt: tests/fixtures/toy_sum/prompts/solver.txt
    tools: [run_python, submit_result]

agents:
  - id: solver-0
    role: solver
    task: "Compute the sum of these integers: 17, -4, 256, 1031, 9, -88, 42, 7, 300, -15."

limits:
  max_turns: 20                # API calls per agent
  max_tokens_per_response: 16000
  max_total_tokens: 200000     # input + output, whole run
  default_timeout_s: 60        # run_python timeout when the agent passes none
  max_timeout_s: 120           # upper bound on run_python timeout_s
  output_cap_bytes: 10000      # per stream, per execution, shown to the agent
  max_stored_output_mb: 100    # per stream, per execution, saved to disk
  max_submissions: 3           # first attempt plus two resubmissions
  api_retries: 2               # retries of a failed API call, each logged

sandbox:
  image: residency-sandbox:py3.14
  memory_mb: 2048               # everything in the container, including /work, /tmp and /dev/shm contents
  work_mb: 256                 # /work size (in memory; the agent's disk quota)
  tmp_mb: 256                  # /tmp size (in memory)
  shm_mb: 256                  # /dev/shm size (in memory)
  cpus: 1.0
  pids_limit: 256
  workspace_archive_max_mb: 100  # cap on the tar of /work kept after each agent ends
