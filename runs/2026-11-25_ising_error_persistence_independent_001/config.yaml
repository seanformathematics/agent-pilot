# Persistence of Ising Error Run
experiment: ising_error_persistence
design: experiments/ising_error_persistence/design.md
topology: independent
model: claude-haiku-5-5
effort: high                  # optional; omit to use the model's own default
rejection_feedback: full      # the other option is truncated

# Experiment code, referenced as "module.path:attribute".
submission_model: experiments.ising_error_persistence.schemas:IsingSubmission
sanity_checks: experiments.ising_error_persistence.checks:check_submission
analysis: experiments.ising_error_persistence.analysis:analyze

roles:
  solver:
    system_prompt: experiments/ising_error_persistence/prompts/solver.txt
    tools: [run_python, submit_result]

agents:
  - id: ising-01
    role: solver
    task: "For a lattice of size N=16 and each temperature T in [1.9, 2.0, 2.1, 2.2, 2.3, 2.4], estimate the Binder cumulant U and its one-sigma statistical error U_err. The target is U_err <= 0.005 for each value of T."
    # task is read by checks.py parser looking for N and T values.
